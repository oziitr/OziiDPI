[package]
name = "ozii-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ozii-cli"
path = "src/main.rs"

[[bin]]
name = "ozii-guard"
path = "src/bin/ozii_guard.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
ozii-core = { version = "0.1.0", path = "../ozii-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
