[package]
name = "ozii-core"
version = "0.1.0"
edition = "2024"

[dependencies]
etherparse = "0.18"
httparse = "1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v4", "fast-rng"] }
windivert = "0.7.0-beta.4"
windivert-sys = "0.11.0-beta.2"
winapi = { version = "0.3.9", features = ["winbase", "winhttp", "winuser", "libloaderapi", "errhandlingapi", "processthreadsapi", "synchapi", "handleapi", "shellapi", "iphlpapi", "tcpmib", "iprtrmib"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
